[project]
name = "granite-retouch"
version = "2.0.0"
description = "AI-ретушь портретов для гравировки на памятниках"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["prepare_vignette", "run_gimp"]
packages = []

[tool.setuptools.package-data]
"*" = ["*.scm", "*.yaml", "*.json"]
