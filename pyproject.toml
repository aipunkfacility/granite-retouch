[project]
name = "granite-retouch"
version = "3.0.0-dev"
description = "AI-ретушь портретов для гравировки на памятниках"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jsonschema>=4.0",
]
webui = ["pydantic>=2.0", "fastapi>=0.110.0", "uvicorn[standard]>=0.29.0", "python-multipart>=0.0.9"]

[project.scripts]
retouch = "retouch.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["retouch*"]

[tool.setuptools.package-data]
retouch = ["*.yaml", "*.json"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

# Legacy scripts kept in root for backward compatibility
# prepare_vignette.py and run_gimp.py still work standalone
