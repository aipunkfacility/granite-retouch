[project]
name = "granite-retouch"
version = "2.6.0"
description = "AI-ретушь портретов для гравировки на памятниках"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jsonschema>=4.0",
]

[project.scripts]
retouch = "retouch.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["retouch*"]

[tool.setuptools.package-data]
retouch = ["*.yaml", "*.json"]

# Legacy scripts kept in root for backward compatibility
# prepare_vignette.py and run_gimp.py still work standalone
