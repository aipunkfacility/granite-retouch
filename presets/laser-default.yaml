# Канонический пресет для стандартной лазерной гравировки (CO2 40-60W)
description: "Стандартные параметры для CO2 лазера (гравировка в оттенках серого). \
  Используется 8-bit grayscale BMP без дизеринга."

processing:
  laser_standard:
    stone_gamma: 0.88
    face_brightness_target_min: 230
    face_brightness_target_max: 245
    white_ceiling: 250
    highlight_start: 200
    shadow_floor: 5
    dither_method: none
    glow_size_min: 40
    glow_size_max: 80
    glow_opacity_min: 30
    glow_opacity_max: 40
    glow_style: outer

vignette:
  vertical_offset: 0.10
  vertical_diameter: 0.50
  blur_radius: 60
  headroom: 0.60
  horizontal_oversize: 0.20
