# САУНО График-3КЛ, CO2 40W. Стандартные параметры laser_standard.
description: "САУНО График-3КЛ, CO2 40W. Стандартные параметры laser_standard."

processing:
  laser_standard:
    stone_gamma: 0.88
    face_brightness_target_min: 230
    face_brightness_target_max: 245
    white_ceiling: 250
    highlight_start: 200
    shadow_floor: 5
    export_mode: 8bit           # 8-bit grayscale — Engrave делает растрирование сам
    step_mm: 0.300              # шаг ЧПУ для laser_standard
    dither_method_1bit: jarvis  # метод дизеринга если оператор переключит на 1bit
    glow_size_min: 40
    glow_size_max: 80
    glow_opacity_min: 30
    glow_opacity_max: 40
    glow_style: outer

vignette:
  enabled: true
  vertical_offset: 0.10
  vertical_diameter: 0.50
  blur_radius: 60
  headroom: 0.60
  horizontal_oversize: 0.20
