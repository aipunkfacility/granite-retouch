# Канонический пресет для мощных лазеров (80W+)
description: "Параметры для мощных CO2 лазеров. Требует дизеринга (Jarvis) \
  для имитации полутонов на 1-bit BMP."

processing:
  laser_80w:
    stone_gamma: 0.85
    face_brightness_target_min: 190
    face_brightness_target_max: 210
    white_ceiling: 235
    highlight_start: 195
    shadow_floor: 5
    dither_method: jarvis
    glow_size_min: 15
    glow_size_max: 25
    glow_opacity_min: 10
    glow_opacity_max: 20
    glow_style: outer

vignette:
  vertical_offset: 0.10
  vertical_diameter: 0.50
  blur_radius: 60
  headroom: 0.60
  horizontal_oversize: 0.20
