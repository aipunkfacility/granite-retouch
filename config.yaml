processing:
  blue_threshold: 30
  fringe_radius: 3
  impact:
    stone_gamma: 0.88
    unsharp_threshold: 1
    face_overshoot_limit: 8
    face_brightness_target_min: 170
    face_brightness_target_max: 215
    white_ceiling: 245
    face_region_top: 0.45
    glow_opacity_max: 80
    glow_opacity_min: 60
    glow_size_max: 25
    glow_size_min: 10
    glow_style: inner
    highlight_start: 185
    shadow_noise_min: 5
    shadow_noise_max: 15
    shadow_noise_threshold: 30
    shadow_floor: 2
    rolloff_compression: 0.35  # soft knee: 0.35=мягкий, 0.50=средний, 0.80=жёсткий
    export_mode: 8bit           # 8-bit grayscale — 256 уровней силы удара
    step_mm: 0.300              # шаг ЧПУ для impact
    dither_method_1bit: stucki  # метод дизеринга если оператор переключит на 1bit
  laser_80w:
    stone_gamma: 1.0                  # при 8bit Engrave сам управляет яркостью
    unsharp_threshold: 3
    face_overshoot_limit: 10
    shadow_floor: 5
    target_pre_fb: 150
    face_brightness_target_min: 160   # перекалибровка: gamma=1.0 вместо 0.85
    face_brightness_target_max: 210   # все пресеты используют 210
    white_ceiling: 235
    face_region_top: 0.45
    glow_opacity_max: 20
    glow_opacity_min: 10
    glow_size_max: 25
    glow_size_min: 15
    glow_style: outer
    highlight_start: 195
    rolloff_compression: 0.35
    export_mode: 8bit           # 8-bit grayscale — Engrave модулирует мощность по яркости
    step_mm: 0.250              # по мануалу САУНО: 0.125–0.250 мм для лазера
    dither_method_1bit: jarvis  # метод дизеринга если оператор переключит на 1bit
  laser_standard:
    stone_gamma: 0.88
    unsharp_threshold: 3
    face_overshoot_limit: 10
    shadow_floor: 5
    face_brightness_target_min: 230
    face_brightness_target_max: 245
    white_ceiling: 250
    face_region_top: 0.45
    glow_opacity_max: 40
    glow_opacity_min: 30
    glow_size_max: 80
    glow_size_min: 40
    glow_style: outer
    highlight_start: 200
    rolloff_compression: 0.35
    export_mode: 8bit           # 8-bit grayscale — Engrave делает растрирование сам
    step_mm: 0.300              # шаг ЧПУ для laser_standard
    dither_method_1bit: jarvis  # метод дизеринга если оператор переключит на 1bit
  min_blue_ratio: 0.15
  min_resolution: 512
  max_resolution: 8192       # Защита от OOM: 8192×8192 × 4 байт ≈ 256 MB
  result_min_black_ratio: 0.25
  mask_soft_sigma: 1.5       # Софт-маска хромакея: 0=бинарная, 1-2=плавные края
  contour_smooth_epsilon: 0.002  # Сглаживание контура cv2: 0.001=мин, 0.005=агрессивное
  # Quality gates — thresholds for pre-check and post-check
  quality_gates:
    variance_loss_threshold: 35.0       # % variance loss before weakening delta
    clipped_pct_threshold: 5.0          # % clipped pixels before reducing rolloff
    p95_shift_threshold: 20.0           # levels p95 shift before weakening delta
    shadow_crush_threshold: 10.0        # % shadow crush before skipping floor/gamma
    face_dark_small_threshold: 5.0      # % face_dark ratio before skipping correction
    contour_inner_quality_threshold: 30.0  # % contour_inner ratio before morphological fallback
# Safety envelope — максимальные дельты коррекции по зонам
safety_envelope:
  face_skin_max_delta: 15.0    # ±15 уровней на 256-шкале ≈ 6%
  face_dark_max_delta: 5.0     # ±5 — минимальное вмешательство
  hair_max_delta: 3.0          # ±3 — почти не трогаем
  clothes_max_delta: 0.0       # 0 — одежда не меняется по решению лица
  highlights_rolloff_only: true      # только сжатие, без подъёма
  contour_inner_glow_only: true      # только glow/edge логика
  contour_outer_antifringe_only: true # только антифринги/фон
config_version: 4
machine:
  step_mm: 0.300
stone:
  material: granite
  type: granite           # deprecated, синхронизируется с material
vignette:
  enabled: true              # NEW: управление виньеткой в пайплайне
  blur_radius: 60
  headroom: 0.6
  horizontal_oversize: 0.2
  vertical_diameter: 0.55
  vertical_offset: 0.10
