# granite-retouch configuration
# Все параметры обработки — в одном месте

processing:
  # Порог для определения синего хромакея
  blue_threshold: 30
  # Минимальная доля синих пикселей (если ниже — хромакей не обнаружен)
  min_blue_ratio: 0.15
  # Минимальное разрешение изображения (px) для обработки
  min_resolution: 512
  # Минимальная доля чёрного фона в результате (проверка корректности)
  result_min_black_ratio: 0.25
  # Радиус расширения маски для удаления синих рефлексов (fringe) по краям
  # 0 — без fringe removal, 3 — стандарт, 5 — агрессивное удаление
  fringe_radius: 3

  laser:
    glow_size_min: 40
    glow_size_max: 80
    glow_opacity_min: 30
    glow_opacity_max: 40
    brightness: 1.18
    face_brightness_target: [100, 130]

  impact:
    glow_size_min: 10
    glow_size_max: 25
    glow_opacity_min: 60
    glow_opacity_max: 80
    brightness: 1.00
    face_brightness_target: [100, 130]
    # Добавлять шум в глубокие тени (чтобы игла не застревала)
    shadow_noise: true

export:
  formats: [tiff, png]
  tiff_compression: none

gimp:
  # Пути поиска GIMP (первый найденный используется)
  search_paths:
    - "F:\\GIMP 2\\bin\\gimp-console-2.10.exe"
    - "C:\\Program Files\\GIMP 2\\bin\\gimp-console-2.10.exe"
  # Переменная окружения для переопределения пути
  env_var: GIMP_PATH

vignette:
  # Отступ нижнего края арки от низа изображения (доля высоты)
  # Больше → больше чёрного внизу. Примеры: 0.05 — почти вплотную, 0.20 — широкий отступ
  vertical_offset: 0.10
  # Высота эллипса арки (доля высоты)
  # Больше → арка выше и шире, больше видно по бокам. Примеры: 0.30 — узкая, 0.60 — широкая
  vertical_diameter: 0.50
  # Размытие края виньетки (px)
  # Больше → плавнее переход. Примеры: 30 — резкий, 80 — очень мягкий
  blur_radius: 60
  # Запас над головой: насколько эллипс вынесен выше изображения (доля высоты)
  # Больше → голова дальше от верхнего края арки, гарантированно видна
  # Примеры: 0.3 — минимальный запас, 0.8 — большой запас
  headroom: 0.6
  # Горизонтальное расширение эллипса за пределы изображения (доля ширины)
  # Больше → арка шире по бокам, меньше чёрного у плеч
  # Примеры: 0.0 — эллипс строго по ширине, 0.3 — широкий захват
  horizontal_oversize: 0.2
