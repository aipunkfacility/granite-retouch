processing:
  blue_threshold: 30
  fringe_radius: 3
  legacy_step_order: false
  impact:
    stone_gamma: 0.90
    unsharp_threshold: 2
    face_brightness_target_min: 200
    face_brightness_target_max: 225
    white_ceiling: 240
    face_region_top: 0.45
    glow_opacity_max: 80
    glow_opacity_min: 60
    glow_size_max: 25
    glow_size_min: 10
    glow_style: outer
    highlight_start: 160
    shadow_noise_min: 5
    shadow_noise_max: 15
    shadow_noise_threshold: 30
    shadow_floor: 8
    dither_method: stucki         # FIX #9: SOP 4.1
  laser_80w:
    stone_gamma: 0.85                 # FIX #8: SOP 5.1
    unsharp_threshold: 3
    shadow_floor: 5
    target_pre_fb: 150                # default из config.py
    face_brightness_target_min: 190   # default / документация: 190
    face_brightness_target_max: 210   # default / документация: 210
    white_ceiling: 235                # default / документация: 235
    face_region_top: 0.45
    glow_opacity_max: 20                  # AUDIT-9.1: приведено к DEFAULTS
    glow_opacity_min: 10
    glow_size_max: 25                      # AUDIT-9.1: приведено к DEFAULTS
    glow_size_min: 15
    glow_style: outer
    highlight_start: 160
    dither_method: jarvis          # FIX #9: SOP 4.1
    dither_upsample: 2              # FIX #10: SOP 5.2
  laser_standard:
    stone_gamma: 0.88
    unsharp_threshold: 3
    shadow_floor: 5
    face_brightness_target_min: 230
    face_brightness_target_max: 245
    white_ceiling: 250
    face_region_top: 0.45
    glow_opacity_max: 40
    glow_opacity_min: 30
    glow_size_max: 80
    glow_size_min: 40
    glow_style: outer
    highlight_start: 200
    dither_method: none
  min_blue_ratio: 0.15
  min_resolution: 512
  max_resolution: 4096       # Защита от OOM
  result_min_black_ratio: 0.25
  mask_soft_sigma: 1.5       # Софт-маска хромакея: 0=бинарная, 1-2=плавные края
machine:
  step_mm: 0.300
stone:
  type: granite
vignette:
  blur_radius: 60
  headroom: 0.6
  horizontal_oversize: 0.2
  vertical_diameter: 0.55
  vertical_offset: 0.10
